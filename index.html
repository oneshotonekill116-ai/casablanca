function getMedicationStore(residentId) {
  if (!residentId) return { latest: null, history: [] };
  try {
    var raw = localStorage.getItem("medication_" + residentId);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { latest: null, history: [] };
}
function setMedicationStore(residentId, store) {
  try {
    localStorage.setItem("medication_" + residentId, JSON.stringify(store));
  } catch(e) {
    console.error("薬情保存失敗:", e);
    alert("薬情の保存に失敗しました(容量オーバー)。古い履歴を削除してください。");
  }
}
function addMedicationEntry(residentId, entry, meta) {
  var store = getMedicationStore(residentId);
  // メタ情報(ホーム名など)も保存
  if (meta) {
    if (meta.homeId) store.homeId = meta.homeId;
    if (meta.homeName) store.homeName = meta.homeName;
    if (meta.residentNameJa) store.residentNameJa = meta.residentNameJa;
  }
  // 既存の最新があれば履歴に移動
  if (store.latest) {
    store.history = (store.history || []);
    store.history.unshift(store.latest);
    if (store.history.length > 10) store.history = store.history.slice(0, 10); // 直近10件
  }
  store.latest = entry;
  setMedicationStore(residentId, store);
  // クラウド同期(本番準備モード時のみ・非同期で投げ放し)
  syncMedicationToCloud(residentId, store).catch(function(err){
    console.warn("薬情のクラウド同期に失敗:", err);
  });
  return store;
}

// クラウド同期(Apps Script Webhook経由)
async function syncMedicationToCloud(residentId, store) {
  try {
    var org = getCurrentOrgSettingsSync() || {};
    if (!org.appsScriptUrl || org.appOperationMode !== "production_prep") return; // 本番モード以外はスキップ
    if (!store || !store.latest) return;
    var body = {
      action: "saveMedication",
      residentId: residentId,
      residentNameJa: store.residentNameJa || "",
      homeId: store.homeId || "",
      homeName: store.homeName || "",
      room: store.room || "",
      latestText: store.latest.text || "",
      capturedAt: store.latest.capturedAt || "",
      editedAt: store.latest.editedAt || "",
      changed: store.latest.changed ? 1 : 0,
      imageBase64: store.latest.imageBase64 || "", // 画像を含む(Apps Script側でDriveに保存)
      historyJson: JSON.stringify((store.history || []).map(function(h){
        // 履歴では画像Base64は除外(容量削減)
        return Object.assign({}, h, { imageBase64: "" });
      }))
    };
    if (org.secret) body.secret = org.secret;
    var res = await fetch(org.appsScriptUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || "saveMedication失敗");
    // 画像をクラウドに保存後、ローカルからBase64を消す(容量節約)
    if (data.imageFileId && store.latest) {
      var s = getMedicationStore(residentId);
      if (s.latest && s.latest.imageBase64) {
        s.latest.imageFileId = data.imageFileId;
        // ローカルにも残しておく(オフライン表示用)
      }
      setMedicationStore(residentId, s);
    }
  } catch(e) {
    throw e;
  }
}

// クラウドから薬情を取得して localStorage に統合
async function fetchMedicationsFromCloud(homeId) {
  try {
    var org = getCurrentOrgSettingsSync() || {};
    if (!org.appsScriptUrl || org.appOperationMode !== "production_prep") return [];
    var url = org.appsScriptUrl + "?action=listMedications" + (homeId ? "&homeId=" + encodeURIComponent(homeId) : "");
    var res = await fetch(url);
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || "listMedications失敗");
    // localStorage に統合
    (data.medications || []).forEach(function(m){
      if (!m.residentId) return;
      var existing = getMedicationStore(m.residentId);
      // クラウドの方が新しければ上書き
      var localUpdate = existing.latest && existing.latest.editedAt;
      var cloudUpdate = m.editedAt || m.capturedAt;
      var isCloudNewer = cloudUpdate && (!localUpdate || new Date(cloudUpdate) > new Date(localUpdate));
      if (isCloudNewer || !existing.latest) {
        var entry = {
          id: "med_cloud_" + m.residentId,
          capturedAt: m.capturedAt || "",
          editedAt: m.editedAt || "",
          imageBase64: existing.latest && existing.latest.imageBase64 || "", // ローカル画像は維持
          imageUrl: m.imageUrl || "",
          imageFileId: m.imageFileId || "",
          text: m.latestText || "",
          ocrError: "",
          changed: !!m.changed,
          previousText: ""
        };
        var newStore = {
          residentId: m.residentId,
          residentNameJa: m.residentNameJa || existing.residentNameJa || "",
          homeId: m.homeId || existing.homeId || "",
          homeName: m.homeName || existing.homeName || "",
          room: m.room || "",
          latest: entry,
          history: m.history || existing.history || []
        };
        setMedicationStore(m.residentId, newStore);
      }
    });
    return data.medications || [];
  } catch(e) {
    console.warn("クラウドから薬情取得失敗:", e);
    return [];
  }
}

}

// 画像をBase64に変換
function fileToBase64(file) {
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(new Error("画像の読み込み失敗")); };
    reader.readAsDataURL(file);
  });
}
// 画像をリサイズ(最大1024px・JPEG変換でサイズ削減)
function resizeImage(dataUrl, maxSize) {
  maxSize = maxSize || 1024;
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = function(){ reject(new Error("画像の処理失敗")); };
    img.src = dataUrl;
  });
}
// Gemini Vision API で薬情画像をテキスト化
async function ocrMedicationImage(imageBase64, orgSettings) {
  var apiKey = orgSettings && orgSettings.geminiApiKey;
  if (!apiKey) throw new Error("Gemini APIキーが未設定です(設定 > Gemini で登録してください)");
  // Base64からプレフィックスを除去
  var pureBase64 = imageBase64.replace(/^data:image\/[^;]+;base64,/, "");
  var url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=" + encodeURIComponent(apiKey);
  var body = {
    contents: [{
      parts: [
        { text: "この画像は服薬情報(薬情)です。処方されている薬剤名、用量、服用タイミング、注意事項を文字起こしして下さい。表形式の場合はマークダウンの表で。注意点があれば最後に箇条書きで。" },
        { inline_data: { mime_type: "image/jpeg", data: pureBase64 } }
      ]
    }]
  };
  var res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    var errText = await res.text();
    throw new Error("Gemini API失敗: " + res.status + " " + errText.slice(0, 200));
  }
  var data = await res.json();
  var text = data.candidates && data.candidates[0] && data.candidates[0].content
    && data.candidates[0].content.parts && data.candidates[0].content.parts[0]
    && data.candidates[0].content.parts[0].text;
  return text || "";
}

function getMedRecords(residentId) {
  if (!residentId) return [];
  try {
    var raw = localStorage.getItem("med_records_" + residentId);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}
function setMedRecords(residentId, records) {
  try { localStorage.setItem("med_records_" + residentId, JSON.stringify(records)); } catch(e) { console.error(e); }
}
function saveMedRecord(residentId, record) {
  var records = getMedRecords(residentId);
  if (record.id) {
    var idx = records.findIndex(function(r){ return r.id === record.id; });
    if (idx >= 0) records[idx] = record;
    else records.unshift(record);
  } else {
    record.id = "MR-" + Date.now() + "-" + Math.random().toString(36).slice(2,6);
    record.createdAt = new Date().toISOString();
    records.unshift(record);
  }
  // 直近の20件のみ保存
  records = records.slice(0, 20);
  setMedRecords(residentId, records);
  return record;
}
function deleteMedRecord(residentId, recordId) {
  var records = getMedRecords(residentId).filter(function(r){ return r.id !== recordId; });
  setMedRecords(residentId, records);
}
// 全利用者から「ダブルチェック未完了」の通院記録を抽出
function getPendingDoubleChecks(residents) {
  var pending = [];
  (residents || []).forEach(function(r){
    var rid = r.residentId || r.id;
    var records = getMedRecords(rid);
    records.forEach(function(rec){
      if (rec.setCheckedAt && (!rec.doubleCheckedAt || rec.doubleCheckStatus === "pending")) {
        pending.push({
          record: rec,
          resident: r
        });
      }
    });
  });
  return pending;
}
// 次回通院予定の取得
function getUpcomingVisits(residents) {
  var today = new Date().toISOString().slice(0,10);
  var upcoming = [];
  (residents || []).forEach(function(r){
    var rid = r.residentId || r.id;
    var records = getMedRecords(rid);
    records.forEach(function(rec){
      if (rec.nextVisitDate && rec.nextVisitDate >= today) {
        upcoming.push({
          record: rec,
          resident: r,
          daysUntil: Math.floor((new Date(rec.nextVisitDate) - new Date(today)) / (1000*60*60*24))
        });
      }
    });
  });
  upcoming.sort(function(a,b){ return a.record.nextVisitDate.localeCompare(b.record.nextVisitDate); });
  return upcoming;
}

      doubleCheckedBy: "",
      doubleCheckedAt: "",
      doubleCheckStatus: "pending",

      noteForHome: "",
      privateNote: "",
      nextVisitDate: "",
      nextVisitTime: "",
      handoverText: ""
    };
  });

  function upd(patch) { setRecord(function(prev){ return Object.assign({}, prev, patch); }); }
  function updNested(key, subkey, val) {
    setRecord(function(prev){
      var sub = Object.assign({}, prev[key] || {});
      sub[subkey] = val;
      var next = Object.assign({}, prev);
      next[key] = sub;
      return next;
    });
  }

  function handleSetCheckToggle(key) {
    var sub = Object.assign({}, record.setChecks || {});
    sub[key] = !sub[key];
    var next = Object.assign({}, record, { setChecks: sub });

    var allChecked = MED_SET_CHECK_ITEMS.every(function(it){ return sub[it.key]; });
    if (allChecked && !record.setCheckedAt) {
      next.setCheckedBy = (currentUser && currentUser.displayName) || "";
      next.setCheckedAt = new Date().toISOString();
    } else if (!allChecked && record.setCheckedAt) {

// === 全textareaを自動高さ調整 ===
(function(){
  function autoResize(el){
    if (!el || el.tagName !== "TEXTAREA") return;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.6) + "px";
  }
  // 入力イベントで自動調整
  document.addEventListener("input", function(e){
    if (e.target && e.target.tagName === "TEXTAREA") autoResize(e.target);
  }, true);
  // フォーカス時にも初期調整
  document.addEventListener("focus", function(e){
    if (e.target && e.target.tagName === "TEXTAREA") autoResize(e.target);
  }, true);
  // 定期的に既存テキストの調整(初期値ロード時用)
  setInterval(function(){
    var areas = document.querySelectorAll("textarea");
    areas.forEach(autoResize);
  }, 2000);
})();
